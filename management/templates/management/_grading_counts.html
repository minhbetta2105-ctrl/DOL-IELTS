<section class="ma-ai"><h4>{{ skill }}</h4><div><span>Tổng<strong>{{ stat.total }}</strong></span><span>Đang chấm<strong>{{ stat.grading }}</strong></span><span>Đã có điểm<strong class="ma-good">{{ stat.graded }}</strong></span><span>Thất bại<strong class="ma-bad">{{ stat.failed }}</strong><a href="{% url 'management:grading_detail' %}?skill={{ skill|upper }}&amp;status=FAILED">Chi tiết</a></span></div></section>
